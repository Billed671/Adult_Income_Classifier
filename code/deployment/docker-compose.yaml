services:
  api:
    build: ./api
    container_name: adult_api
    ports:
      - "8000:8000"
    volumes:
      - ../../models:/app/models:ro
    environment:
      - MODEL_PATH=/app/models/best_model.joblib
    restart: unless-stopped

  app:
    build: ./app
    container_name: adult_app
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/predict
    depends_on:
      - api
    restart: unless-stopped